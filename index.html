<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estado del sistema</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5f6b7a;
      --ok: #1f9d55;
      --border: #e2e5ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1c2129;
        --text: #e8ebf0;
        --muted: #9aa5b4;
        --ok: #3ccf7a;
        --border: #2b313b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .tarjeta {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    h1 { margin: 0 0 16px; font-size: 1.15rem; }
    .estado {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .punto {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ok);
    }
    .etiqueta { font-size: 0.8rem; color: var(--muted); margin: 0; }
    .hora {
      font-size: 2.4rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin: 4px 0;
    }
    .fecha { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main class="tarjeta">
    <h1>Estado del sistema</h1>
    <div class="estado"><span class="punto"></span> Operativo</div>
    <p class="etiqueta">Hora en Ciudad de México</p>
    <div class="hora" id="hora">--:--:--</div>
    <p class="fecha" id="fecha"></p>
  </main>
  <script>
    const zona = "America/Mexico_City";
    const fmtHora = new Intl.DateTimeFormat("es-MX", {
      timeZone: zona, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    });
    const fmtFecha = new Intl.DateTimeFormat("es-MX", {
      timeZone: zona, weekday: "long", day: "numeric", month: "long", year: "numeric"
    });

    function actualizar() {
      const ahora = new Date();
      document.getElementById("hora").textContent = fmtHora.format(ahora);
      document.getElementById("fecha").textContent = fmtFecha.format(ahora);
    }

    actualizar();
    setInterval(actualizar, 1000);
  </script>
</body>
</html>
