<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estado del sistema</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #0b1f3a;
      --text: #f1f5fb;
      --muted: #a9b8cf;
      --ok: #3ccf7a;
      --border: #1a3460;
      --boton: #1e4b8f;
      --boton-hover: #2a5ca8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --border: #24447a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .tarjeta {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      color: var(--text);
      box-shadow: 0 6px 20px rgba(11, 31, 58, 0.25);
    }
    h1 { margin: 0 0 16px; font-size: 1.15rem; }
    .estado {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .punto {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ok);
    }
    .etiqueta { font-size: 0.8rem; color: var(--muted); margin: 0; }
    .hora {
      font-size: 2.4rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin: 4px 0;
    }
    .fecha { margin: 0 0 20px; color: var(--muted); }
    .copiar {
      width: 100%;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--boton);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .copiar:hover { background: var(--boton-hover); }
    .copiar:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="tarjeta">
    <h1>Estado del sistema</h1>
    <div class="estado"><span class="punto"></span> Operativo</div>
    <p class="etiqueta">Hora en Ciudad de México</p>
    <div class="hora" id="hora">--:--:--</div>
    <p class="fecha" id="fecha"></p>
    <button type="button" class="copiar" id="copiar">Copiar hora</button>
  </main>
  <script>
    const zona = "America/Mexico_City";
    const fmtHora = new Intl.DateTimeFormat("es-MX", {
      timeZone: zona, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    });
    const fmtFecha = new Intl.DateTimeFormat("es-MX", {
      timeZone: zona, weekday: "long", day: "numeric", month: "long", year: "numeric"
    });

    function actualizar() {
      const ahora = new Date();
      document.getElementById("hora").textContent = fmtHora.format(ahora);
      document.getElementById("fecha").textContent = fmtFecha.format(ahora);
    }

    actualizar();
    setInterval(actualizar, 1000);

    const boton = document.getElementById("copiar");
    let temporizador;

    async function copiarTexto(texto) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(texto);
        return;
      }
      // Respaldo para navegadores o contextos sin la API del portapapeles
      const area = document.createElement("textarea");
      area.value = texto;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(area);
      if (!ok) throw new Error("No se pudo copiar");
    }

    boton.addEventListener("click", async () => {
      const hora = fmtHora.format(new Date());
      try {
        await copiarTexto(hora);
        boton.textContent = `Copiado: ${hora}`;
      } catch {
        boton.textContent = "No se pudo copiar";
      }
      clearTimeout(temporizador);
      temporizador = setTimeout(() => { boton.textContent = "Copiar hora"; }, 2000);
    });
  </script>
</body>
</html>
